version: 1.4.{build}
image: Visual Studio 2022
install:
  - ps: |
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:temp\dotnet-install.ps1"
      & $env:temp\dotnet-install.ps1 -Architecture x64 -Version '10.0.100' -InstallDir "$env:ProgramFiles\dotnet"
configuration: Release
before_build:
  - nuget restore
build:
  project: .\SerialPortLib.sln
  verbosity: minimal
test:
  assemblies:
    only:
      - SerialPortLib.Tests/bin/Debug/SerialPortLib.Tests.dll
after_test:
  - ps: .\SerialPortLib\nuget_pack.ps1
artifacts:
  - path: '*.nupkg'
    name: SerialPortLib nupkg
deploy:
  - provider: GitHub
    auth_token:
      secure: QJoBiqbeg1z+3WRoH1IdXRsnXtvwS95U2Z89JH9DrnEhJYMYbRpKjUmGEbOU3OnDLFz8gKqzP8y7KpL226lCb/Y+W6CTt7EGouenMIKnzZBllZVvSG73LdhHgD8RbxIy
    draft: false
    prerelease: false    
    on:
      appveyor_repo_tag: true
  - provider: NuGet
    api_key:
      secure: VLSz2Mm3RJU7/uhvY1kOSfewPUL43YB7sxMOadvqUyrIFcU2DV2S84mtuySIJJX0
    skip_symbols: false
    artifact: /.*\.nupkg/
    on:
      appveyor_repo_tag: true
